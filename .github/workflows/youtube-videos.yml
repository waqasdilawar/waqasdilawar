name: Latest YouTube videos

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "YOUTUBE"
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCIOiNJquF-ZZ_QvFVdHTImg"
          max_post_count: 5
          template: "$newline- [$title]($url)"
          commit_message: "Update latest YouTube videos"
